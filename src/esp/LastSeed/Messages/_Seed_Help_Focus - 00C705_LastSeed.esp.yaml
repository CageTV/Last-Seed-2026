Description:
  TargetLanguage: English
  Value: >-
    FOCUS


    When in a dangerous environment, like a dungeon or fighting an enemy, you will become Focused.


    While Focused, your basic needs will not increase over time. When the danger subsides, all of the hunger, thirst, and fatigue you would have gained will come rushing back. Because of this, you may be very hungry, thirsty, or tired when you leave a dungeon. You may need to recover before moving on.
