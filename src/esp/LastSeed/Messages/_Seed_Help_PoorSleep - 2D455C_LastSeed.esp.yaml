Description:
  TargetLanguage: English
  Value: >+
    POOR SLEEP


    You did not sleep well, which means your fatigue level was not fully restored. The quality of your sleep can be affected by your location and how hungry and thirsty you are. 


    Try to go to bed fully sated and in a safe location to get the best possible sleep.
