Description:
  TargetLanguage: English
  Value: >-
    PROGRESSIVE DISEASES


    You have caught a disease! If left untreated, your disease will become more severe as time goes on. You may be able to cure your disease by travelling to a safe place and getting plenty of rest. Increasing your disease resistance will also help to overcome diseases. 


    There are a few individuals throughout Skyrim who are skilled at curing diseases, such as the Members of the Silver Hand and the Priests of Kynareth in Whiterun.
